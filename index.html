    <script>
        // Firebase configuration (same as mainsite)
        const firebaseConfig = {
            apiKey: "AIzaSyAa5Dc6mHueStG5nAdW4J-n8ZKcftKDuao",
            authDomain: "chess-edfb2.firebaseapp.com",
            databaseURL: "https://chess-edfb2-default-rtdb.firebaseio.com",

            storageBucket: "chess-edfb2.firebasestorage.app",
            messagingSenderId: "837865253873",
            appId: "1:837865253873:web:8551b32c85af22d4413250",
            measurementId: "G-Q4FXBQ767P"
        };

        // Initialize Firebase for index page
        let firebaseApp, auth;
        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            console.log('Firebase initialized on index.html');
        } catch (error) {
            console.error('Firebase initialization error on index.html:', error);
        }

        // Google sign-in that redirects to mainsite on success
        function signInWithGoogle() {
            if (!auth) {
                alert('Firebase not configured. Please add your Firebase credentials.');
                return;
            }

            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    // On success, redirect to main site where the user will be recognized
                    window.location.href = 'mainsite.html';
                })
                .catch((error) => {
                    console.error('Sign in error:', error);
                    alert('Sign in failed: ' + error.message);
                });
        }

        // If already signed in, go straight to main site
        if (auth) {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    window.location.href = 'mainsite.html';
                }
            });
        }
    </script>
